name: Telegram breaking news
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send one test message to the channel"
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: telegram-breaking
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .tg-state
          key: tg-state-${{ github.run_id }}
          restore-keys: tg-state-
      - name: Send breaking news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TEST: ${{ inputs.test && '1' || '' }}
        run: |
          # GitHub's cron fires only every ~12-14 minutes, so each run keeps checking every ~30 seconds for ~10 minutes (speed first: «أهم شيء السرعة»)
          # (runs queue one after another, so the bar is watched almost continuously). State lives in .tg-state between passes.
          if [ -n "$TG_TEST" ]; then node scripts/telegram-breaking.mjs; exit $?; fi
          end=$(( $(date +%s) + 600 ))
          while true; do
            node scripts/telegram-breaking.mjs || true
            [ $(( $(date +%s) + 25 )) -ge $end ] && break
            sleep 25
          done
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tg-state
          key: tg-state-${{ github.run_id }}
      - name: Chain the next run
        # GitHub's own schedule leaves gaps of 10-20 minutes; each run starts the next one so the channel is watched without a break
        if: always() && inputs.test != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram-breaking.yml --repo "$GITHUB_REPOSITORY" --ref main || true
